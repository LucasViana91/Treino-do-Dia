<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0E10">
<title>Ficha do Dia · Jornada Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Ficha do Dia: um formulário rápido, uma pergunta por tela, que termina numa ficha de treino.
   Mesma identidade do Jornada Fit: ferro escuro, texto cor de giz, brasa como energia e as cores das anilhas marcando os grupos musculares.
   Funciona sem internet: se as fontes não carregarem, entram fontes condensadas do próprio aparelho. */
:root {
  color-scheme: dark;
  --ferro: #0D0E10;
  --placa: #16181B;
  --placa-2: #1F2226;
  --linha: #2B2F35;
  --giz: #EDEBE6;
  --cinza: #9399A1;
  --cinza-2: #646A72;
  --brasa: #FF5B22;
  --brasa-2: #FF8A57;
  --sobre-brasa: #140804;
  --vermelha: #E5383B;
  --azul: #2F80ED;
  --amarela: #F2C230;
  --verde: #2FBF71;
  --branca: #E9E7E1;
  --sombra: rgba(0, 0, 0, 0.5);
  --f-display: "Big Shoulders Display", "Bahnschrift Condensed", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", Impact, sans-serif;
  --f-texto: "Archivo", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--ferro);
  color: var(--giz);
  font-family: var(--f-texto);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--brasa); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.pagina {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Tipografia */
.display { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.95; text-wrap: balance; margin: 0; }
.rotulo { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cinza); }
.suave { color: var(--cinza); margin: 0; }
.pequeno { font-size: 13px; color: var(--cinza); line-height: 1.4; }
.num { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.brasa { color: var(--brasa); }

/* Topo */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: 0.05em; text-transform: uppercase; }
.marca-sinal { width: 28px; height: 28px; border-radius: 8px; background: var(--brasa); display: grid; place-items: center; color: var(--sobre-brasa); }
.marca-sinal svg.i { width: 17px; height: 17px; stroke-width: 2.6; }
.data { font-family: var(--f-mono); font-size: 12px; color: var(--cinza); letter-spacing: 0.08em; text-transform: uppercase; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 54px; padding: 0 20px; border-radius: 15px; font-weight: 700; font-size: 16px; transition: transform .12s, background .2s, opacity .2s; user-select: none; -webkit-user-select: none; }
.btn:active { transform: scale(.98); }
.btn-primario { background: var(--brasa); color: var(--sobre-brasa); }
.btn-primario:hover { background: var(--brasa-2); }
.btn-secundario { background: var(--placa-2); border: 1px solid var(--linha); }
.btn-fantasma { color: var(--cinza); min-height: 46px; }
.btn-bloco { width: 100%; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn-icone { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--placa-2); border: 1px solid var(--linha); flex: none; }
.acoes-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Abertura */
.abertura { flex: 1; display: flex; flex-direction: column; gap: 22px; }
.abertura-titulo { font-size: clamp(54px, 15vw, 84px); line-height: .86; }
.abertura-titulo em { font-style: normal; color: var(--brasa); }
.anilhas { display: flex; align-items: center; margin-top: 6px; }
.anilhas svg + svg { margin-left: -14px; }
.passos-lista { display: flex; flex-direction: column; }
.passo-item { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; padding: 13px 0; border-top: 1px solid var(--linha); }
.passo-num { font-family: var(--f-display); font-weight: 800; font-size: 26px; color: var(--brasa); }
.resumo-semana { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--placa); border: 1px solid var(--linha); border-radius: 16px; }

/* Perguntas */
.progresso { display: flex; align-items: center; gap: 12px; }
.barra { flex: 1; height: 6px; border-radius: 99px; background: var(--placa-2); overflow: hidden; }
.barra > span { display: block; height: 100%; background: var(--brasa); border-radius: 99px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.pergunta { display: flex; flex-direction: column; gap: 18px; flex: 1; animation: entrar .35s cubic-bezier(.2,.8,.2,1); }
.pergunta-titulo { font-size: clamp(34px, 9vw, 46px); }
@keyframes entrar { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.opcoes { display: flex; flex-direction: column; gap: 10px; }
.opcao { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-radius: 16px; border: 1.5px solid var(--linha); background: var(--placa); text-align: left; transition: border-color .15s, background .15s; }
.opcao:hover { border-color: var(--cinza-2); }
.opcao[aria-pressed="true"] { border-color: var(--brasa); background: color-mix(in srgb, var(--brasa) 10%, var(--placa)); }
.opcao-marca { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--cinza-2); flex: none; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.opcao.multi .opcao-marca { border-radius: 7px; }
.opcao[aria-pressed="true"] .opcao-marca { background: var(--brasa); border-color: var(--brasa); color: var(--sobre-brasa); }
.opcao-marca svg.i { width: 14px; height: 14px; stroke-width: 3.2; opacity: 0; }
.opcao[aria-pressed="true"] .opcao-marca svg.i { opacity: 1; }
.opcao-titulo { font-weight: 700; font-size: 16px; display: block; }
.grade-opcoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.grade-opcoes .opcao { flex-direction: column; justify-content: center; gap: 2px; padding: 18px 8px; text-align: center; }
.grade-opcoes .opcao .num { font-size: 34px; }
.grade-opcoes .opcao-marca { display: none; }
.grupo-cor { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.entrada { display: flex; align-items: center; background: var(--placa); border: 1.5px solid var(--linha); border-radius: 16px; padding: 0 16px; }
.entrada:focus-within { border-color: var(--brasa); }
.entrada input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 20px; font-weight: 600; padding: 16px 0; }
.nota-historico { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--azul) 13%, var(--placa)); border: 1px solid color-mix(in srgb, var(--azul) 38%, var(--linha)); font-size: 13.5px; }
.nota-historico svg.i { color: var(--azul); width: 18px; height: 18px; margin-top: 1px; }
.rodape { position: sticky; bottom: 0; margin-top: auto; padding-top: 14px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); background: linear-gradient(to top, var(--ferro) 72%, transparent); display: flex; gap: 10px; }

/* Gerando */
.gerando { flex: 1; display: grid; place-items: center; text-align: center; }
.gerando svg.anilha { animation: girar 1.1s cubic-bezier(.5,0,.3,1) infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* Ficha */
.ficha-cab { display: flex; flex-direction: column; gap: 10px; padding: 20px 18px; border-radius: 20px; border: 1px solid var(--linha);
  background: radial-gradient(120% 100% at 100% 0%, color-mix(in srgb, var(--brasa) 18%, transparent), transparent 58%), var(--placa); position: relative; overflow: hidden; }
.ficha-cab::after { content: ""; position: absolute; right: -70px; top: -70px; width: 200px; height: 200px; border-radius: 50%; border: 24px solid color-mix(in srgb, var(--brasa) 10%, transparent); pointer-events: none; }
.ficha-titulo { font-size: clamp(46px, 13vw, 68px); }
.metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.metrica { background: var(--placa-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.metrica .num { font-size: 26px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: var(--placa-2); }
.cartao { background: var(--placa); border: 1px solid var(--linha); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.porque li { margin: 0; padding-left: 4px; }
.porque ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.porque li::marker { color: var(--brasa); }
.bloco { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: 14px; background: var(--placa); border: 1px solid var(--linha); font-size: 14px; }
.bloco svg.i { color: var(--brasa); margin-top: 1px; }
.lista { display: flex; flex-direction: column; }
.ex { display: grid; grid-template-columns: 132px 1fr; gap: 12px 14px; padding: 16px 0; border-top: 1px solid var(--linha); align-items: start; }
.ex.grande { grid-template-columns: 1fr; }
.ex-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ex-corpo { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ex-corpo .series { margin-top: 0; }
.ilu-caixa { position: relative; width: 100%; aspect-ratio: 120 / 96; max-width: 100%; border-radius: 14px; background:
  radial-gradient(90% 70% at 50% 100%, color-mix(in srgb, var(--brasa) 7%, transparent), transparent 70%), var(--placa-2); border: 1px solid var(--linha); overflow: hidden; display: block; padding: 0; }
.ex.grande .ilu-caixa { max-width: 420px; justify-self: center; }
.ilu-caixa svg { width: 100%; height: 100%; display: block; }
.ilu-caixa .ex-num { position: absolute; top: 6px; left: 8px; font-size: 18px; color: var(--cinza); }
.ex.feito .ilu-caixa { border-color: color-mix(in srgb, var(--verde) 60%, var(--linha)); }
.ilu-lupa { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 7px; background: color-mix(in srgb, var(--ferro) 70%, transparent); display: grid; place-items: center; color: var(--cinza); }
.ilu-lupa svg.i { width: 13px; height: 13px; }
.legenda { font-size: 12.5px; line-height: 1.35; color: var(--giz); opacity: .82; display: flex; gap: 6px; align-items: flex-start; }
.legenda svg.i { width: 14px; height: 14px; color: var(--brasa); margin-top: 1px; }
@media (max-width: 359px) { .ex { grid-template-columns: 1fr; } .ilu-caixa { max-width: 240px; } }
.ex:first-child { border-top: 0; padding-top: 4px; }
.ex-num { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--cinza-2); }
.ex.feito .ex-num { color: var(--verde); }
.ex-nome { font-weight: 700; font-size: 16.5px; line-height: 1.3; }
.prescricao { font-family: var(--f-mono); font-size: 13.5px; font-weight: 600; color: var(--brasa); }
.tecnica { font-size: 13px; color: var(--amarela); }
.series { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.serie { min-width: 46px; height: 42px; padding: 0 10px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--placa-2); font-family: var(--f-display); font-weight: 800; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; }
.serie[aria-pressed="true"] { background: var(--brasa); border-color: var(--brasa); color: var(--sobre-brasa); }
.serie svg.i { width: 16px; height: 16px; stroke-width: 3; }
.ex-acoes { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 2px; }
.link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--brasa); padding: 6px 0; }
.link svg.i { width: 16px; height: 16px; }
.focos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.foco { flex: none; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--linha); background: var(--placa); font-weight: 600; font-size: 14px; white-space: nowrap; }
.foco[aria-pressed="true"] { background: var(--giz); color: var(--ferro); border-color: var(--giz); }
.foco .recup { font-size: 11px; color: var(--cinza); font-weight: 500; }
.descanso { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--ferro) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--linha);
  padding-top: 12px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.descanso > div { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.descanso .num { font-size: 34px; min-width: 70px; }
.descanso-barra { height: 4px; border-radius: 99px; background: var(--placa-2); overflow: hidden; max-width: 560px; margin: 10px auto 0; }
.descanso-barra span { display: block; height: 100%; background: var(--brasa); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translate(-50%, -18px); z-index: 50; opacity: 0; pointer-events: none;
  background: var(--giz); color: var(--ferro); font-weight: 700; padding: 12px 18px; border-radius: 14px; box-shadow: 0 12px 30px var(--sombra); width: max-content; max-width: calc(100% - 36px);
  display: flex; gap: 10px; align-items: center; transition: opacity .25s, transform .25s; }
.toast.visivel { opacity: 1; transform: translate(-50%, 0); }
.toast svg.i { color: var(--brasa); }
.aviso { font-size: 12.5px; color: var(--cinza); text-align: center; line-height: 1.45; margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@media (min-width: 720px) { .pagina { padding-top: 40px; } }
</style>

<body>
<div class="pagina" id="raiz"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Ilustrações animadas dos exercícios
   Um boneco de vista lateral (ou frontal) vai da posição inicial (A) à final (B) em loop.
   Cada pose é descrita por pontos-chave (quadril, ombro, mão, pé); cotovelos e joelhos
   são calculados por cinemática inversa, então os membros mantêm o comprimento.
   Área de desenho: 120 x 96, chão em y = 92, boneco olhando para a direita.
   ===================================================================== */
const ILU = (() => {
  const L = { tronco: 26, coxa: 19, canela: 19, braco: 14, antebraco: 13 };
  const CHAO = 92;
  const rad = (g) => (g * Math.PI) / 180;
  const soma = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpP = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  const espelho = (p) => [120 - p[0], p[1]];
  const f1 = (n) => Math.round(n * 10) / 10;

  function ik(raiz, alvo, l1, l2, lado) {
    const dx = alvo[0] - raiz[0], dy = alvo[1] - raiz[1];
    const d = Math.hypot(dx, dy) || 0.001;
    const max = l1 + l2 - 0.01, min = Math.abs(l1 - l2) + 0.01;
    const dd = Math.max(min, Math.min(max, d));
    const base = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd);
    const ang = base + lado * Math.acos(Math.max(-1, Math.min(1, cosA)));
    const junta = [raiz[0] + l1 * Math.cos(ang), raiz[1] + l1 * Math.sin(ang)];
    const fim = d > max ? [raiz[0] + (dx / d) * (l1 + l2 - 0.01), raiz[1] + (dy / d) * (l1 + l2 - 0.01)] : alvo;
    return [junta, fim];
  }

  // Transforma a descrição de uma pose em pontos do corpo
  function resolver(pz, cfg) {
    const q = pz.q;
    const o = pz.o || [q[0] + L.tronco * Math.cos(rad(pz.t)), q[1] - L.tronco * Math.sin(rad(pz.t))];
    const dx = o[0] - q[0], dy = o[1] - q[1], n = Math.hypot(dx, dy) || 1;
    const cab = pz.h || [o[0] + (dx / n) * 9, o[1] + (dy / n) * 9];
    const coxa = cfg.coxa || L.coxa;
    const jl = pz.jl != null ? pz.jl : cfg.jl != null ? cfg.jl : -1;
    const cl = pz.cl != null ? pz.cl : cfg.cl != null ? cfg.cl : 1;
    const perna = (pe, jx, lado) => (jx ? [jx, pe] : ik(q, pe, coxa, L.canela, lado));
    const braco = (mao, cx, lado) => (cx ? [cx, mao] : ik(o, mao, L.braco, L.antebraco, lado));
    const m = pz.m || (pz.mo ? soma(o, pz.mo) : [o[0] + 2, o[1] + 26]);
    const m2 = pz.m2 || (pz.mo2 ? soma(o, pz.mo2) : m);
    const p = pz.p || [q[0], CHAO];
    const p2 = pz.p2 || p;
    const [j, pp] = perna(p, pz.j, jl);
    const [j2, pp2] = perna(p2, pz.j2 || (pz.p2 ? null : pz.j), pz.jl2 != null ? pz.jl2 : jl);
    const [c, mm] = braco(m, pz.c, cl);
    const [c2, mm2] = braco(m2, pz.c2 || (pz.m2 || pz.mo2 ? null : pz.c), pz.cl2 != null ? pz.cl2 : cl);
    return { q, o, cab, j, p: pp, j2, p2: pp2, c, m: mm, c2, m2: mm2, curva: pz.curva || 0, pa: pz.pa || 0, pa2: pz.pa2 != null ? pz.pa2 : pz.pa || 0 };
  }
  function misturar(a, b, t) {
    const r = {};
    for (const k of Object.keys(a)) r[k] = Array.isArray(a[k]) ? lerpP(a[k], b[k], t) : lerp(a[k], b[k], t);
    return r;
  }

  /* ---------- Equipamentos e cenário ---------- */
  const COR = { corpo: "var(--giz, #EDEBE6)", fundo: "var(--cinza-2, #646A72)", metal: "var(--cinza, #9399A1)", placa: "var(--brasa, #FF5B22)", movel: "var(--linha, #2B2F35)", estofado: "#3A3F47" };
  const ln = (a, b, w, cor, extra = "") => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${cor}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  const rect = (x, y, w, h, cor, r = 1.5) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r}" fill="${cor}"/>`;
  const circ = (p, r, cor, extra = "") => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${cor}" ${extra}/>`;
  const CENARIO = {
    banco: (x1, x2, y) => rect(x1, y, x2 - x1, 4, COR.estofado) + ln([x1 + 4, y + 4], [x1 + 4, CHAO], 2.5, COR.movel) + ln([x2 - 4, y + 4], [x2 - 4, CHAO], 2.5, COR.movel),
    encosto: (a, b) => ln(a, b, 5, COR.estofado),

    const P = misturar(prep.A, prep.B, t);
    return prep.def.frente ? desenharFrente(P, prep.def) : desenharLateral(P, prep.def);

  function svg(id, t = 0) {
    const prep = preparar(id);

  }

  const reduzir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function laco(agora) {
    if (!visiveis.size) { rodando = false; return; }
    if (agora - ultimo > 33) {
      ultimo = agora;
      const ciclo = 2600, x = (agora % ciclo) / ciclo;
      const t = 0.5 - 0.5 * Math.cos(x * 2 * Math.PI); // vai e volta suave
      for (const el of visiveis) {
        if (!el.isConnected) { visiveis.delete(el); continue; }
        const prep = preparar(el.dataset.ilu), g = el.querySelector(".ilu-corpo");
        if (prep && g) g.innerHTML = quadro(prep, t);
      }

  }
  function animar(raiz) {
    const els = (raiz || document).querySelectorAll("svg.ilustracao");
    if (reduzir) { els.forEach((el) => { const p = preparar(el.dataset.ilu); el.querySelector(".ilu-corpo").innerHTML = quadro(p, 1); }); return; }

  }

})();

function iniciarPerguntas(soDia) {
  const p = memoria.perfil;
  ui.r = soDia && p ? { ...p } : { ...(p || {}) };
  if (!ui.r.limitacoes) ui.r.limitacoes = [];
  // Pré-preenche com o histórico salvo neste aparelho
  ui.prefill = {};
  const semana = historicoDaSemana();
  if (memoria.historico.length) {
    const rec = paraPessoa(gruposRecentes());
    const resto = paraPessoa(semana.flatMap((x) => x.grupos)).filter((g) => !rec.includes(g));
    ui.r.semana = Math.min(5, semana.length);
    ui.r.recentes = rec;
    ui.r.semanaGrupos = resto;
    ui.prefill = { semana: true, recentes: true, semanaGrupos: true };
  } else {
    delete ui.r.semana; ui.r.recentes = []; ui.r.semanaGrupos = [];
  }
  delete ui.r.tempo; delete ui.r.energia;
  ui.fila = soDia && p ? DIA_CAMPOS.slice() : [...PERFIL_CAMPOS, ...DIA_CAMPOS];
  ui.idx = 0; ui.variacao = 0; ui.vistos = []; ui.tipoForcado = null;
  ui.tela = "pergunta";
  pularSeNecessario();
  render(); topo();
}
function pularSeNecessario() {
  // Sem treinos na semana, não faz sentido perguntar o que foi treinado antes de ontem
  while (ui.fila[ui.idx] === "semanaGrupos" && ui.r.semana === 0) ui.idx++;
}
function respondida(campo) {
  const q = PERGUNTAS[campo], v = ui.r[campo];
  if (q.tipo === "texto") return true;
  if (q.tipo === "multi") return Array.isArray(v) && (v.length > 0 || ui.r[campo + "_nada"] || ui.prefill[campo]);
  return v !== undefined && v !== null;
}
function avancar() {
  ui.idx++;
  pularSeNecessario();
  if (ui.idx >= ui.fila.length) return montarFicha();
  render(); topo();
}

          ${it.descanso ? `<button class="link" data-a="descansar" data-i="${i}">${ic("timer")}Descanso ${it.descanso}s</button>` : ""}
        </div>
      </div>
    </div>`;
  }).join("");
  const focos = f.ranking.map((x) => `<button class="foco" aria-pressed="${x.id === f.tipo}" data-a="foco" data-t="${x.id}">${TIPOS[x.id].nome}${x.recuperando ? ' <span class="recup">· em recuperação</span>' : ""}</button>`).join("");
  const concluida = memoria.historico.some((x) => x.data === hoje() && x.tipo === f.tipo && x.variacao === ui.variacao);
  return `${cabecalho()}
  <section class="ficha-cab">
    <span class="rotulo">${nome ? `Ficha de ${nome} · ` : ""}${formatarData(hoje())}</span>
    <h1 class="display ficha-titulo">${f.t.nome}</h1>
    <span class="suave">${f.t.sub}</span>
    <div class="metricas">
      <div class="metrica"><span class="rotulo">Tempo</span><span class="num">~${f.minutos}<span class="pequeno"> min</span></span></div>
      <div class="metrica"><span class="rotulo">${f.t.circuito ? "Estações" : "Exercícios"}</span><span class="num">${f.itens.length}</span></div>
      <div class="metrica"><span class="rotulo">${f.t.circuito ? "Voltas" : "Séries"}</span><span class="num">${f.t.circuito ? f.voltas : totalSeries}</span></div>
    </div>
    <div class="tags">${tags}</div>
  </section>

  <section class="cartao porque">
    <span class="rotulo">Por que esta ficha</span>
    <ul>${f.porque.map((x) => `<li>${x}</li>`).join("")}</ul>
  </section>

  <div class="bloco">${ic("chama")}<span><strong>Aquecimento:</strong> ${aquecimento(f)}</span></div>
  ${f.t.circuito ? `<div class="bloco">${ic("info")}<span><strong>Como fazer:</strong> passe por todas as estações em sequência. Ao fim de cada volta, descanse 1 minuto. Faça ${f.voltas} voltas.</span></div>` : ""}

  <section class="cartao" style="gap:0">
    <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:10px">
      <span class="rotulo">${f.t.circuito ? "Estações" : "Exercícios"}</span>
      <span class="pequeno"><span class="num" style="font-size:16px;color:var(--giz)">${feitas}</span>/${totalSeries} ${f.t.circuito ? "voltas" : "séries"} feitas</span>
    </div>
    <div class="barra" style="margin-bottom:6px"><span style="width:${totalSeries ? Math.round((feitas / totalSeries) * 100) : 0}%"></span></div>
    <div class="lista">${lista}</div>
  </section>

  ${f.finalizador ? `<div class="bloco">${ic("chama")}<span><strong>Finalizador:</strong> ${f.finalizador}</span></div>` : ""}
  <div class="bloco">${ic("vento")}<span><strong>Volta à calma:</strong> ${VOLTA}</span></div>
  <div class="bloco">${ic("info")}<span>${f.tipo === "recuperacao" || f.t.circuito ? "Mantenha um ritmo em que consiga respirar com controle." : "Escolha uma carga em que as últimas repetições sejam difíceis, mas ainda com boa técnica. Desça o peso em 2 a 3 segundos."}</span></div>

  <button class="btn btn-primario btn-bloco" data-a="concluir" ${concluida ? "disabled" : ""}>${ic("bandeira")}${concluida ? "Treino salvo no histórico" : "Concluí este treino"}</button>
  <div class="acoes-2">
    <button class="btn btn-secundario" data-a="outra">${ic("nova")}Outra ficha</button>
    <button class="btn btn-secundario" data-a="copiar">${ic("copiar")}Copiar ficha</button>
  </div>

  <section style="display:flex;flex-direction:column;gap:10px">
    <span class="rotulo">Prefere outro foco hoje?</span>
    <div class="focos">${focos}</div>
  </section>

  <button class="btn btn-fantasma" data-a="refazer">${ic("voltar")}Refazer as perguntas</button>
  <p class="aviso">Sentiu dor aguda, tontura ou falta de ar? Pare e procure orientação. Esta ficha é uma sugestão geral e não substitui um profissional.</p>
  <div style="height:${ui.descanso ? 96 : 0}px"></div>
  ${barraDescanso()}`;
}
function barraDescanso() {
  if (!ui.descanso) return "";
  return `<div class="descanso" id="descanso"><div>
      ${ic("timer")}<span class="num" id="descanso-num">0:00</span><span class="pequeno" style="flex:1">Descanso</span>
      <button class="btn-icone" data-a="mais15" aria-label="Mais 15 segundos" style="width:auto;padding:0 12px;font-weight:700">+15s</button>
      <button class="btn-icone" data-a="pularDescanso" aria-label="Pular descanso">${ic("pular")}</button>
    </div><div class="descanso-barra"><span id="descanso-barra"></span></div></div>`;
}
function render() {
  raiz.innerHTML = ui.tela === "pergunta" ? telaPergunta() : ui.tela === "gerando" ? telaGerando() : ui.tela === "ficha" ? telaFicha() : telaInicio();
  if (ui.tela === "pergunta" && PERGUNTAS[ui.fila[ui.idx]].tipo === "texto") {
    const el = raiz.querySelector("input");
    if (el && window.matchMedia("(pointer: fine)").matches) el.focus();
  }
  rodarDescanso();
  if (ui.tela === "ficha" && typeof ILU !== "undefined") ILU.animar(raiz);
}

/* ---------- Descanso ---------- */
let tique = null;
function rodarDescanso() {
  clearInterval(tique);
  if (!ui.descanso) return;
  const passo = () => {
    const d = ui.descanso;
    if (!d) return clearInterval(tique);
    const resta = Math.ceil((d.fim - Date.now()) / 1000);
    if (resta <= 0) {
      ui.descanso = null; clearInterval(tique);
      try { navigator.vibrate && navigator.vibrate([200, 80, 200]); } catch (e) { /* sem vibração */ }
      avisar("Descanso encerrado. Próxima série!", "timer");
      const el = document.getElementById("descanso"); if (el) el.remove();
      return;
    }
    const n = document.getElementById("descanso-num"), b = document.getElementById("descanso-barra");
    if (n) n.textContent = `${Math.floor(resta / 60)}:${pad(resta % 60)}`;
    if (b) b.style.width = `${Math.max(0, Math.min(100, (resta / d.total) * 100))}%`;
  };
  passo();
  tique = setInterval(passo, 250);
}
function iniciarDescanso(seg) { if (!seg) return; ui.descanso = { fim: Date.now() + seg * 1000, total: seg }; }

let timerToast = null;
function avisar(texto, icone = "brilho") {
  const t = document.getElementById("toast");
  t.innerHTML = `${ic(icone)}<span>${esc(texto)}</span>`;
  t.classList.add("visivel");
  clearTimeout(timerToast);
  timerToast = setTimeout(() => t.classList.remove("visivel"), 2600);
}

/* ---------- Texto para copiar e mandar no WhatsApp ---------- */
function textoFicha() {
  const f = ui.ficha, r = ui.r, d = new Date();
  const linhas = [`*FICHA DO DIA · ${pad(d.getDate())}/${pad(d.getMonth() + 1)}*${r.nome ? ` · ${r.nome.trim()}` : ""}`, `*${f.t.nome.toUpperCase()}* (${f.t.sub.replace(/ · /g, ", ")}) · ~${f.minutos} min`, "", `Aquecimento: ${aquecimento(f)}`];
  if (f.t.circuito) linhas.push(`Circuito: ${f.voltas} voltas, 1 min de descanso entre elas.`);
  linhas.push("");
  f.itens.forEach((it, i) => linhas.push(`${i + 1}. ${it.ex.nome}: ${it.texto}${it.tecnica ? ` (${it.tecnica})` : ""}`));
  if (f.finalizador) linhas.push("", `Finalizador: ${f.finalizador}`);
  linhas.push("", `Volta à calma: ${VOLTA}`, "", "_Gerado pela Ficha do Dia · Jornada Fit_");
  return linhas.join("\n");
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); return true; } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = texto; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove(); return ok;
  }
}

/* ---------- Ações ---------- */
const acoes = {
  perfil() { iniciarPerguntas(false); },
  dia() { iniciarPerguntas(true); },
  voltar() {
    if (ui.idx === 0) { ui.tela = "inicio"; render(); return topo(); }
    ui.idx--;
    while (ui.fila[ui.idx] === "semanaGrupos" && ui.r.semana === 0 && ui.idx > 0) ui.idx--;
    render(); topo();
  },
  unica(ds) {
    const campo = ui.fila[ui.idx];
    ui.r[campo] = ds.n ? Number(ds.v) : ds.v;
    if (campo === "genero" && !ui.r._enfaseEscolhida) ui.r.enfase = ds.v === "feminino" ? "inferiores" : "equilibrado";
    if (campo === "enfase") ui.r._enfaseEscolhida = true;
    delete ui.prefill[campo];
    render();
    setTimeout(avancar, 170);
  },
  multi(ds) {
    const campo = ui.fila[ui.idx], l = ui.r[campo] || [];
    ui.r[campo] = l.includes(ds.v) ? l.filter((x) => x !== ds.v) : [...l, ds.v];
    ui.r[campo + "_nada"] = false; delete ui.prefill[campo];
    render();
  },
  nada() {
    const campo = ui.fila[ui.idx];
    ui.r[campo] = []; ui.r[campo + "_nada"] = true; delete ui.prefill[campo];
    render();
  },
  continuar() {
    const campo = ui.fila[ui.idx];
    if (campo === "nome") ui.r.nome = (ui.r.nome || "").trim();
    if (PERGUNTAS[campo].tipo === "multi" && ui.prefill[campo]) ui.r[campo + "_nada"] = !(ui.r[campo] || []).length;
    avancar();
  },
  serie(ds) {
    const i = Number(ds.i), j = Number(ds.j), l = ui.feitos[i] || [];
    l[j] = !l[j]; ui.feitos[i] = l;
    const it = ui.ficha.itens[i];
    if (l[j] && it.descanso && !ui.ficha.t.circuito) iniciarDescanso(it.descanso);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  zoom(ds) { const i = Number(ds.i); ui.zoom[i] = !ui.zoom[i]; const y = window.scrollY; render(); window.scrollTo(0, y); },
  descansar(ds) { iniciarDescanso(ui.ficha.itens[Number(ds.i)].descanso); const y = window.scrollY; render(); window.scrollTo(0, y); },
  mais15() { if (ui.descanso) { ui.descanso.fim += 15000; ui.descanso.total += 15; } },
  pularDescanso() { ui.descanso = null; const y = window.scrollY; render(); window.scrollTo(0, y); },
  trocar(ds) {
    const i = Number(ds.i), f = ui.ficha, it = f.itens[i];
    const emUso = new Set(f.itens.map((x) => x.ex.id));
    for (let k = 1; k <= it.opcoes.length; k++) {
      const pos = (it.pos + k) % it.opcoes.length, id = it.opcoes[pos];
      if (!emUso.has(id) || id === it.ex.id) {
        it.pos = pos; it.ex = POR_ID[id];
        Object.assign(it, prescrever(it.ex, it.filtro, ui.r, f.t.circuito));
        delete it.tecnica; break;
      }
    }
    ui.feitos[i] = [];
    const y = window.scrollY; render(); window.scrollTo(0, y);
    avisar(`Trocado por: ${it.ex.nome}`, "trocar");
  },
  outra() {
    ui.vistos.push(ui.ficha.tipo); ui.variacao++; ui.tipoForcado = null;
    if (ui.vistos.length >= Object.keys(TIPOS).length) ui.vistos = [ui.ficha.tipo];
    ui.ficha = construirFicha(); ui.feitos = {}; ui.zoom = {}; ui.descanso = null; render(); topo();
    avisar(`Nova ficha: ${ui.ficha.t.nome}`, "nova");
  },
  foco(ds) {
    ui.tipoForcado = ds.t; ui.variacao++;
    ui.ficha = construirFicha(ds.t); ui.feitos = {}; ui.descanso = null; render(); topo();
  },
  concluir() {
    const f = ui.ficha;
    const perfil = Object.fromEntries(PERFIL_CAMPOS.map((c) => [c, ui.r[c]]));
    perfil._enfaseEscolhida = ui.r._enfaseEscolhida;
    memoria.perfil = perfil;
    memoria.historico = memoria.historico.filter((x) => x.data !== hoje());
    const grupos = f.tipo === "corpo" ? ["quadriceps", "peito", "costas", "posterior", "ombros"] : [...new Set([...f.t.grupos, ...f.itens.map((it) => it.ex.grupo)])].filter((g) => g !== "mobilidade");
    memoria.historico.push({ data: hoje(), tipo: f.tipo, variacao: ui.variacao, grupos, exercicios: f.itens.map((it) => it.ex.id) });
    memoria.historico = memoria.historico.slice(-60);
    guardar();
    ui.descanso = null;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    avisar("Treino salvo. A próxima ficha vai levar isso em conta.", "bandeira");
  },
  async copiar() {
    const texto = textoFicha();
    if (navigator.share && window.matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ title: "Ficha do Dia", text: texto }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    avisar((await copiar(texto)) ? "Ficha copiada. É só colar no WhatsApp." : "Não deu para copiar neste aparelho.", "copiar");
  },
  refazer() { iniciarPerguntas(!!memoria.perfil); },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = acoes[el.dataset.a];
  if (fn) fn(el.dataset, el, ev);
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (ui.tela !== "pergunta" || !el.dataset || !el.dataset.campo) return;
  ui.r[el.dataset.campo] = el.value;
  const b = document.getElementById("continuar");
  if (b) b.innerHTML = `${el.value.trim() ? "Continuar" : "Pular"}${ic("seta")}`;
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.tagName === "INPUT") { ev.preventDefault(); const b = document.getElementById("continuar"); if (b) b.click(); }
});

// Se já existe perfil salvo, salva também quando a pessoa só atualiza o perfil sem concluir treino
window.addEventListener("pagehide", () => {
  if (ui.tela === "ficha" && ui.r.nivel) {
    const perfil = Object.fromEntries(PERFIL_CAMPOS.map((c) => [c, ui.r[c]]));
    perfil._enfaseEscolhida = ui.r._enfaseEscolhida;
    memoria.perfil = perfil; guardar();
  }
});

render();
</script>
</body>
